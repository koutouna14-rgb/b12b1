# Discord bot token (https://discord.com/developers/applications)
# Put the real token in plugins/discordbridge/config.properties on your proxy, NOT in GitHub.
token=YOUR_BOT_TOKEN

# ID of the Discord channel to sync with (Developer Mode -> right click channel -> Copy ID)
channel-id=1571810127932301453

# Webhook for the SAME channel (Channel settings -> Integrations -> Webhooks -> New Webhook -> Copy URL).
# With a webhook, in-game chat appears in Discord as the player's rank + name + skin head.
# Leave empty to use bot embeds instead.
# Put the real webhook in plugins/discordbridge/config.properties on your proxy, NOT in GitHub.
webhook-url=

# Player head image. {uuid} and {name} are replaced automatically.
avatar-url=https://mc-heads.net/avatar/{uuid}/128

# true  = chat is sent to Discord by the DiscordBridge-Backend jar AFTER chat filters (ChatSentry ...) ran,
#         so censored words stay censored on Discord and blocked messages never show up there.
#         Needs DiscordBridge-Backend (1.3.1+) on every Paper server.
# false = old behaviour: the proxy reads chat itself (works without the backend jar, but is UNCENSORED).
chat-from-backend=true
chat-debug=false

# Show chat from one server to players on the other servers (lobby <-> smp)
relay-between-servers=true

# Messages that START with one of these (comma-separated) are NOT sent to Discord and NOT relayed
# to other servers. "#" keeps justTeams team chat private. Empty = relay everything.
chat-ignore-prefixes=#

# Post join / leave / server-switch cards
announce-join-leave=true

# Display names for your servers. Key = server name in velocity.toml
server.lobby1=Lobby
server.smp=SMP
server.events=Events

# Server name (from velocity.toml) that /hub, /lobby and /l send players to
lobby-server=lobby1

# ---- !ip / !website auto replies --------------------------------------
# Answers "!ip", "!website", "!web" and questions like "what is the ip?" / "whats the ip"
# in Discord (and in game only if info-ingame=true).
server-ip:Java: play.aethermc.club | Alternative Java IP: 185.207.166.22:21791 | Bedrock: 185.207.166.22 • Port: 12007
website=https://aethermc.club
reply.ip=&aServer IP: &f{ip}
reply.website=&aWebsite: &b{website}
# Discord channels where the bot also answers playerlist / !ip / ip / "what's the ip" / website / "what's the website"
# (these messages are never sent to Minecraft). "all" = every channel the bot can read,
# or a list of channel IDs: 1234567890,9876543210. Empty = only the bridge channel.
info-channels=all
# false = !ip / website questions typed in Minecraft chat are NOT answered (Discord only)
info-ingame=false

# ---- Ranks (needs LuckPerms installed on the Velocity proxy) ----------
# Name shown on Discord (webhook name). Discord can't show colours, so the rank is plain text.
# Placeholders: {prefix} {name} {server}
discord-name-format={prefix} {name} \u2022 {server}

# In-game lines shown to players on OTHER servers. Colour codes: &a, &#RRGGBB
# Placeholders: {server} {prefix} {name} {message} {from} {to}
format.chat=&a[{server}] &r{prefix}&f{name} &7\u00BB &f{message}
format.join=&a[{server}] &e+ &r{prefix}&f{name} &ejoined the network
format.move=&a[{server}] &r{prefix}&f{name} &emoved &7{from} &e\u2192 &7{to}
format.leave=&c[{server}] &e- &r{prefix}&f{name} &eleft the network

# ---- Discord roles shown in Minecraft -----------------------------------
# Shows the member's highest Discord role (in the role's colour) in front of their name,
# e.g. "[Discord] OWNER Mirai >> hi"
discord-show-role=true
discord-role-uppercase=true

# Discord images/files -> Minecraft. false = they are NOT sent to Minecraft chat
# (a message that only contains an image is ignored completely).
# true = a clickable [Image] link is shown (GIFs show [GIF]).
discord-relay-images=true
discord-relay-files=true
# Pixel-art preview of still images (png/jpg/bmp, not GIFs) drawn in chat with coloured blocks.
discord-image-preview=false
# Width in characters (8-96) and max height in lines (4-48). Bigger = more detail but fills more chat.
# If the lines wrap in game, lower the width.
discord-image-preview-width=48
discord-image-preview-max-rows=32
# Block height relative to its width. 1.0 = square cells. If images look stretched sideways, raise it
# (e.g. 1.5); if stretched upwards, lower it (e.g. 0.7).
discord-image-preview-char-ratio=1.0
# Transparent areas are cropped away / left empty. Empty cells inside the picture are drawn as this many
# spaces (a space is narrower than a block; 2 is about right). If the picture looks shifted, try 1 or 3.
discord-image-preview-blank-width=2
# Anti-spam for previews (the clickable [Image] link is always shown, only the pixel art is limited).
# One preview per user every X seconds, and at most one preview on the whole network every Y seconds.
# Only the first image of a message gets a preview. Set to 0 to disable a limit.
discord-image-preview-cooldown-seconds=30
discord-image-preview-global-cooldown-seconds=5

# ---- Channel topic ------------------------------------------------------
# Bot needs the "Manage Channel" permission. Discord limits topic edits to about 2 per
# 10 minutes, so values under 10 are raised to 10.
topic-enabled=true
topic-update-minutes=10
# Leave -1 to use the max players from velocity.toml
topic-max-players=-1
# Added on top of the counted players (set to e.g. 157 to keep your old total)
unique-players-offset=0
# Placeholders: %playercount% %playermax% %uniqueplayers% %uptimeminutes% %date%
topic-format=%playercount%/%playermax% players online | %uniqueplayers% unique players ever joined | Server online for %uptimeminutes% minutes | Last update: %date%

# ---- Discord "playerlist" ----------------------------------------------
# Typing playerlist / Playerlist / pleyerlist / player list / !playerlist / who's online
# in the Discord channel shows a pretty list of players per server + the total.
playerlist-enabled=true
# The message the user typed is deleted after this many seconds (bot needs "Manage Messages").
# Use -1 to never delete it.
playerlist-delete-seconds=7
# Also delete the bot's list after X seconds (0 = keep it) - 7 stops channel spam
playerlist-delete-reply-seconds=7
# Servers to show, in order (names from velocity.toml). Leave empty to show every server.
playerlist-servers=lobby1,smp,events
playerlist-title=\u2726 AetherMC \u2022 Online Players
# Embed side-bar colour (hex) and optional logo (leave empty to use the bot's avatar)
playerlist-color=9B59F5
playerlist-icon-url=
# Optional custom emoji per server (key = server name in velocity.toml)
# playerlist.emoji.lobby1=:house:

# ---- Mention pings + replies ---------------------------------------------
# Linking is NOT done here. The separate AetherMC plugin (plugin id below) owns the links and this
# plugin only reads them, so both stay in sync.
link-plugin-id=aethermc
# How often the link list is re-read from the AetherMC plugin
link-refresh-seconds=30
# Discord -> game: @mentioning a linked member, or typing @MinecraftName, highlights the message
# and plays a sound for that player. Game -> Discord: "@MinecraftName" of a linked player pings them.
mention-enabled=true
# true = typing the name WITHOUT "@" also pings (xaetherealx, xAetherealx, XAETHEREALX ...).
# Only names of linked players, whole words only. false = the "@" is required.
mention-without-at=true
# Names shorter than this need the "@" (stops short names like "ace" pinging by accident)
mention-plain-min-length=4
# true = the highlighted mention uses the member's Discord role colour (yellow if they have none)
mention-use-discord-color=true
# true = only players who linked their Discord can be pinged by @MinecraftName
mention-require-link=true
# TESTING ONLY: true lets you ping yourself. Turn it off again afterwards.
mention-allow-self=false
mention-sound=minecraft:entity.experience_orb.pickup
# Discord replies show a "↪ Name" tag in game chat
reply-enabled=true
# line   = classic look, on its own line above the message:  ↪ replying to Name: text
# inline = compact, same line:  [Discord] Mirai ↪ Name » message   (hover the name = quoted text)
reply-style=line
# Colours: "#RRGGBB" or a Minecraft colour name (aqua, gold, green, white ...)
# The name uses the replied-to member's Discord role colour; reply-color is used when they have none
reply-color=#55FFFF
reply-label-color=#6D6F78
reply-text-color=#B5BAC1
# inline style only
reply-arrow-color=#FFAA00
# inline style only: true = also show a short quote in the line itself
reply-show-text=false

# ---- Emoji -> readable text -----------------------------------------------
# Minecraft's chat font can't draw emoji (they show as empty boxes), so Discord emoji are
# converted to text in game:  😂 -> :joy:   🇵🇭 -> :flag_ph:   <:pepe:123> -> :pepe:   1️⃣ -> [1]
emoji-convert=true
# name     = :face_with_tears_of_joy: style names for everything
# emoticon = common ones become :) XD <3 (y) ..., the rest still use names
emoji-style=name
# Discord stickers are shown as [Sticker: name]
emoji-stickers=true
# Per-emoji replacement. Key = Unicode code point in hex (https://unicode.org/emoji/charts/full-emoji-list.html)
# emoji.override.1F602=LOL
# emoji.override.1F480=dead

# ---- Deaths / kills / advancements (needs DiscordBridge-Backend on the Paper servers) ----------------
# Velocity can't see these events, so the DiscordBridge-Backend jar on each Paper server sends them here.
# All enabled by default. Turn a server off if it gets too spammy (e.g. announce-deaths.events=false),
# then run /bridge reload - no restart needed.
# Key = server name in velocity.toml. A per-server line beats the global line.
announce-deaths=true
announce-kills=true
announce-advancements=true
announce-deaths.lobby1=true
announce-deaths.smp=true
announce-deaths.events=true
announce-kills.lobby1=true
announce-kills.smp=true
announce-kills.events=true
announce-advancements.lobby1=true
announce-advancements.smp=true
announce-advancements.events=true
# A player killing a player is posted as a KILL (instead of the death line, so it isn't shown twice).
# If kills are off for that server but deaths are on, the normal death line is posted instead.
# Placeholders: {message} {victim} {killer} {weapon} {player} {server}
discord-format-death=\u2620 {message}
discord-format-kill=\u2694 {killer} killed {victim} using {weapon}
discord-format-kill-noweapon=\u2694 {killer} killed {victim}
discord-format-advancement=\uD83C\uDFC6 {message}

# ---- Status channel (auto rename + live status card) ----------------------------------------------------
# The bot renames this channel (green / orange / red circle) and keeps ONE status message up to date.
# Bot needs: View Channel, Send Messages, Embed Links, Manage Channel (for the rename).
# Discord only allows ~2 renames per 10 minutes, so the name only changes when the state really changes.
# The status card itself refreshes every status-refresh-seconds (minimum 15).
#   green  = network online          (set automatically)
#   orange = maintenance             (/bridge maintenance on|off  - permission discordbridge.maintenance)
#   red    = proxy stopped, or every backend server unreachable
# A crash can't announce itself: after a crash the card/name stay at the last state until the proxy is back.
status-enabled=true
status-channel-id=1486671158194602094
status-refresh-seconds=60
status-rename-enabled=true
# auto = keep the channel's current name exactly as it is (custom font included) and ONLY swap the circle emoji.
# Or write a full name with {emoji} where the circle goes (only used if the current name has no circle).
status-channel-name=auto
status-emoji-online=\uD83D\uDFE2
status-emoji-maintenance=\uD83D\uDFE0
status-emoji-down=\uD83D\uDD34
status-text-online=Online
status-text-maintenance=Maintenance
status-text-down=Offline
status-title=\u2726 AetherMC \u2022 Server Status
# Servers shown on the card, in order (names from velocity.toml). Leave empty to show every server.
status-servers=lobby1,smp,events
# Each server's own icon on the card
status.server-emoji.lobby1=\uD83C\uDFE0
status.server-emoji.smp=\uD83C\uDF32
status.server-emoji.events=\u2694\uFE0F

# ---- Reloading --------------------------------------------------------------------------------------------
# /bridge reload  (permission discordbridge.reload, console works too) re-reads this file live.
# Only the bot token and channel-id need a proxy restart.

# --- invisible killers (Discord only; in game they are already hidden) ---
# Name shown instead of the killer when they have the Invisibility effect at the moment of the kill
invisible-killer-name=[REDACTED]
# Head shown instead of their skin. Host unknown_head.png somewhere permanent and put the direct link here.
invisible-killer-avatar-url=https://mc-heads.net/avatar/MHF_Question/128

